<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recreação Baby — Escola Infantil</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffdf8;--coral:#e05a47;--coral2:#c9442f;--or:#e07b00;--ink:#1d1a17;--mute:#6f6760;--line:#f1e7d0;--cream:#fffbea;--blue:#dff0ff;--blueT:#0b5a8a;--yel:#fff0c4;--yelT:#7a3a00;--pink:#ffe1e6;--pinkT:#b0245a;--green:#d3f8e4;--greenT:#0f6b4a;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
h1,h2,h3,.po{font-family:Poppins,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.hide{display:none!important}
.grad{background:linear-gradient(135deg,#fff3c9,#fff4e6 45%,#ffe3e6)}
/* login */
let modo="resp";
const msg=(t,ok)=>{const e=$("#err");e.textContent=t;e.style.color=ok?"var(--greenT)":""};
function setModo(m){modo=m;$("#p-resp").classList.toggle("hide",m!=="resp");$("#p-dir").classList.toggle("hide",m!=="dir");document.querySelectorAll("[data-md]").forEach(b=>b.classList.toggle("on",b.dataset.md===m));msg("")}
function abrir(u){U=u;msg("");$("#login").classList.add("hide");$("#app").classList.remove("hide");pg="inicio";selAl=null;draw();scrollTo(0,0)}
function entrarResp(m){
  m=m.trim().toUpperCase();
  const a=db.alunos.find(a=>a.mat.toUpperCase()===m);
  if(!a){msg("Matrícula não encontrada. Confira o número e tente de novo.");return}
  abrir({role:"resp",nome:a.resp});
}
function entrarDir(email,senha){
  const d=db.dirs.find(x=>x.email===email.trim().toLowerCase()&&x.senha===senha);
  if(!d){msg(db.dirs.length?"E-mail ou senha incorretos.":"Nenhuma direção cadastrada ainda. Use o botão “Cadastrar direção”.");return}
  abrir({role:"dir",nome:d.nome});
}
document.querySelectorAll("[data-md]").forEach(b=>b.onclick=()=>setModo(b.dataset.md));
$("#go").onclick=()=>modo==="resp"?entrarResp($("#mat").value):entrarDir($("#dem").value,$("#dsn").value);
["#mat","#dem","#dsn"].forEach(q=>$(q).onkeydown=e=>{if(e.key==="Enter")$("#go").click()});
$("#out").onclick=()=>{U=null;["#mat","#dem","#dsn"].forEach(q=>$(q).value="");msg("");$("#app").classList.add("hide");$("#login").classList.remove("hide")};
$("#cdir").onclick=()=>{
  const ja=db.dirs.length>0;
  dlg('<h2>Cadastrar direção</h2><label>Nome</label><input name="nome"><label>E-mail (será o login)</label><input name="email" type="email"><label>Senha (mín. 6 caracteres)</label><input name="senha" type="password" autocomplete="new-password"><label>Confirmar senha</label><input name="senha2" type="password" autocomplete="new-password">'+(ja?'<p class="sm" style="margin:14px 0 0"><b>Autorização:</b> informe o e-mail e a senha de uma direção já cadastrada.</p><label>E-mail da direção cadastrada</label><input name="aemail" type="email"><label>Senha dela</label><input name="asenha" type="password" autocomplete="off">':''),v=>{
    const em=v.email.toLowerCase();
    if(!v.nome||!em.includes("@"))return"Informe o nome e um e-mail válido.";
    if(v.senha.length<6)return"A senha precisa ter pelo menos 6 caracteres.";
    if(v.senha!==v.senha2)return"As senhas não conferem.";
    if(db.dirs.some(d=>d.email===em))return"Já existe uma direção com este e-mail.";
    if(ja&&!db.dirs.some(d=>d.email===(v.aemail||"").toLowerCase()&&d.senha===v.asenha))return"Autorização inválida: e-mail ou senha da direção cadastrada incorretos.";
    db.dirs.push({id:uid(),nome:v.nome,email:em,senha:v.senha});save();
    setModo("dir");$("#dem").value=em;$("#dsn").value="";msg("Direção cadastrada. Entre com seu e-mail e senha.",true);
  });
};

function dlg(html,ok){
  $("#fm").innerHTML=html+'<p class="err" id="de"></p><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button type="button" class="ghost" id="dx">Cancelar</button><button type="button" class="pri" id="dk">Salvar</button></div>';
  $("#dlg").showModal();$("#dx").onclick=()=>$("#dlg").close();
  $("#dk").onclick=()=>{const v=Object.fromEntries([...$("#fm").elements].filter(e=>e.name).map(e=>[e.name,e.value.trim()]));const r=ok(v);if(r)$("#de").textContent=r;else $("#dlg").close()};
}

/* layout */
const PAGES=[["inicio","🏠 Início"],["agenda","✨ Agenda"],["calendario","🗓 Calendário"],["boletim","📖 Boletim"],["financeiro","💳 Financeiro"],["comprovantes","🧾 Comprovantes"],["alunos","👥 Alunos & Turmas",1],["painel","🏫 Painel de Turmas",1]];
function draw(){
  $("#who").innerHTML=esc(U.nome)+`<span class="badge">${dir()?"Diretoria":"Responsável"}</span>`;
  $("#nav").innerHTML=PAGES.filter(p=>dir()||!p[2]).map(p=>`<button class="${p[0]===pg?"on":""}" data-g="${p[0]}">${p[1]}</button>`).join("");
  $("#pg").innerHTML=({inicio,agenda,calendario,boletim,financeiro,comprovantes,alunos,painel})[pg]();
}
$("#nav").onclick=e=>{const b=e.target.closest("[data-g]");if(b){pg=b.dataset.g;draw();scrollTo(0,0)}};
const empty=t=>`<p class="empty">${t}</p>`;
const postHTML=(p,del)=>`<div class="item"><span class="ic">${p.ic}</span><div><b>${esc(p.titulo)}</b><br><small>${dia(p.data)} • ${esc(p.turma)}</small>${p.txt?`<div class="sm">${esc(p.txt)}</div>`:""}</div>${del?`<button class="x" data-a="pdel" data-i="${p.id}" aria-label="Excluir">🗑</button>`:""}</div>`;
const evHTML=(e,del)=>`<div class="item ${e.data<hojeISO()?"past":""}"><span class="ic">🎉</span><div><b>${esc(e.titulo)}</b><br><small>${dia(e.data)} • ${esc(e.turma)}</small>${e.txt?`<div class="sm">${esc(e.txt)}</div>`:""}</div>${del?`<button class="x" data-a="edel" data-i="${e.id}" aria-label="Excluir">🗑</button>`:""}</div>`;

function inicio(){
  const ids=meus().map(a=>a.id),F=db.fin.filter(f=>ids.includes(f.aluno)&&!f.pago),H=hojeISO();
  const prox=db.eventos.filter(e=>e.data>=H&&visivel(e)).sort((a,b)=>a.data.localeCompare(b.data));
  const ult=db.posts.filter(visivel).sort((a,b)=>b.data.localeCompare(a.data)).slice(0,3);
  const dt=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  return`<section class="hello grad"><small>${dt}</small><h1>Olá, ${dir()?"Direção":esc(U.nome.split(" ")[0])}! 👋</h1><div class="sm" style="font-size:1rem">Tudo pronto para mais um dia de brincadeiras e aprendizado por aqui.</div></section>
  <div class="stats"><div class="st" style="background:var(--blue);color:var(--blueT)"><span class="e">🧒</span><b>${ids.length}</b><span>Alunos matriculados</span></div>
  <div class="st" style="background:var(--yel);color:var(--yelT)"><span class="e">💛</span><b>${brl(F.reduce((s,f)=>s+f.valor,0))}</b><span>Mensalidades em aberto</span></div>
  <div class="st" style="background:var(--pink);color:var(--pinkT)"><span class="e">⏰</span><b>${F.filter(f=>f.venc<H).length}</b><span>Mensalidades atrasadas</span></div>
  <div class="st" style="background:var(--green);color:var(--greenT)"><span class="e">🎈</span><b>${prox.length}</b><span>Próximos eventos</span></div></div>
  <div class="two"><section class="card"><div class="hd"><h2>🎉 Próximos eventos</h2><button class="lk" data-g="calendario">Ver calendário</button></div>${prox.slice(0,3).map(e=>evHTML(e)).join("")||empty("Nenhum evento agendado por enquanto.")}</section>
  <section class="card"><div class="hd"><h2>✨ Últimas da agenda</h2><button class="lk" data-g="agenda">Ver agenda</button></div>${ult.map(p=>postHTML(p)).join("")||empty("Nada publicado ainda.")}</section></div>`;
}
function agenda(){
  const L=db.posts.filter(visivel).sort((a,b)=>b.data.localeCompare(a.data));
  return`<section class="card"><div class="hd"><h2>✨ Agenda</h2></div>${dir()?`<div class="row"><div><label for="pt">Título</label><input id="pt"></div><div><label for="pu">Turma</label><select id="pu"><option>Geral</option>${TURMAS.map(t=>`<option>${t}</option>`).join("")}</select></div><div><label for="pi">Ícone</label><select id="pi">${ICONES.map(i=>`<option>${i}</option>`).join("")}</select></div></div><label for="px">Recado</label><textarea id="px"></textarea><p><button class="pri" data-a="padd">Publicar na agenda</button></p>`:""}${L.map(p=>postHTML(p,dir())).join("")||empty("Nada publicado ainda.")}</section>`;
}
function calendario(){
  const L=[...db.eventos].filter(visivel).sort((a,b)=>a.data.localeCompare(b.data));
  return`<section class="card"><div class="hd"><h2>🗓 Calendário</h2></div>${dir()?`<div class="row"><div><label for="et">Evento</label><input id="et"></div><div><label for="ed">Data</label><input id="ed" type="date" value="${hojeISO()}"></div><div><label for="eu">Turma</label><select id="eu"><option>Geral</option>${TURMAS.map(t=>`<option>${t}</option>`).join("")}</select></div></div><label for="ex">Detalhes</label><textarea id="ex" style="min-height:60px"></textarea><p><button class="pri" data-a="eadd">Adicionar evento</button></p>`:""}${L.map(e=>evHTML(e,dir())).join("")||empty("Nenhum evento cadastrado.")}</section>`;
}
function boletim(){
  const M=meus();if(!M.length)return`<section class="card">${empty("Nenhum aluno cadastrado.")}</section>`;
  if(!M.some(a=>a.id===selAl))selAl=M[0].id;
  const a=aluno(selAl),b=db.bol[a.id]||{areas:{},obs:""};
  return`<section class="card"><div class="hd"><h2>📖 Boletim pedagógico</h2><select id="bs" style="max-width:260px" aria-label="Aluno">${M.map(x=>`<option value="${x.id}" ${x.id===a.id?"selected":""}>${esc(x.nome)} — ${esc(x.turma)}</option>`).join("")}</select></div>
  ${AREAS.map(r=>`<div class="area"><b>${r}</b>${dir()?`<select data-ar="${r}">${CONC.map(c=>`<option ${c===(b.areas[r]||CONC[0])?"selected":""}>${c}</option>`).join("")}</select>`:`<span class="tg t-op">${b.areas[r]||"Ainda não avaliado"}</span>`}</div>`).join("")}
  <label for="ob">Observações da professora</label><textarea id="ob" ${dir()?"":"disabled"}>${esc(b.obs)}</textarea>${dir()?`<p><button class="pri" data-a="bsave">Salvar boletim</button> <span class="sm" id="ok"></span></p>`:""}</section>`;
}
function financeiro(){
  const ids=meus().map(a=>a.id),F=db.fin.filter(f=>ids.includes(f.aluno)).sort((a,b)=>a.venc.localeCompare(b.venc));
  return`<section class="card"><div class="hd"><h2>💳 Financeiro</h2><button class="ghost" data-g="comprovantes">Ver comprovantes</button></div><div class="sc"><table><tr><th>Aluno</th><th>Mês</th><th>Vencimento</th><th>Valor</th><th>Situação</th>${dir()?"<th></th>":""}</tr>${F.map(f=>{const s=status(f);return`<tr><td>${esc(aluno(f.aluno)?.nome)}</td><td>${mesNome(f.mes)}</td><td>${dia(f.venc)}</td><td>${brl(f.valor)}</td><td><span class="tg ${s[1]}">${s[0]}</span></td>${dir()?`<td><button class="ghost" data-a="pay" data-i="${f.id}">${f.pago?"Desfazer":"Marcar pago"}</button></td>`:""}</tr>`}).join("")||`<tr><td colspan="6">${empty("Sem mensalidades.")}</td></tr>`}</table></div></section>`;
}
function comprovantes(){
  const mine=meus().map(a=>a.id);
  const C=(db.comprovantes||[]).filter(c=>dir()||mine.includes(c.aluno)).sort((a,b)=>b.enviado.localeCompare(a.enviado));
  const alunoOptions=meus().map(a=>`<option value="${a.id}">${esc(a.nome)} — ${esc(a.turma)}</option>`).join("");
  const form=!dir()?`<section class="card">
    <div class="hd"><h2>📤 Enviar comprovante</h2><span class="tg t-op">Mensalidade</span></div>
    <label for="c-aluno">Criança</label><select id="c-aluno">${alunoOptions}</select>
    <div class="row"><div><label for="c-mes">Mês de referência</label><input id="c-mes" type="month" value="${hojeISO().slice(0,7)}"></div>
    <div><label for="c-valor">Valor pago (R$)</label><input id="c-valor" inputmode="decimal" placeholder="350,00"></div></div>
    <label for="c-data">Data do pagamento</label><input id="c-data" type="date" value="${hojeISO()}">
    <label for="c-arquivo">Comprovante (PDF, JPG ou PNG; até 5 MB)</label><input id="c-arquivo" type="file" accept=".pdf,image/jpeg,image/png">
    <button class="pri" data-a="csubmit">Enviar comprovante</button>
  </section>`:"";
  const rows=C.map(c=>{
    const a=aluno(c.aluno),statusLabel=c.status==="confirmed"?"Confirmado":c.status==="rejected"?"Recusado":"Aguardando análise";
    const cls=c.status==="confirmed"?"t-ok":c.status==="rejected"?"t-late":"t-op";
    return `<div class="item"><span class="ic">🧾</span><div><b>${esc(a?.nome||"Aluno")}</b><br>
      <small>${esc(mesNome(c.mes+"-01"))} • ${brl(c.valor)} • Enviado em ${dia(c.enviado)}</small><br>
      <small>Arquivo selecionado: ${esc(c.arquivo)}</small><br>
      <span class="tg ${cls}">${statusLabel}</span>
      ${c.motivo?`<div class="sm">Motivo: ${esc(c.motivo)}</div>`:""}
      ${c.revisadoEm?`<small>Revisado em ${dia(c.revisadoEm)} por ${esc(c.revisadoPor||"Diretoria")}</small>`:""}
      </div>${dir()&&c.status==="pending"?`<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="pri" data-a="cconfirm" data-i="${c.id}">Confirmar</button><button class="ghost" data-a="creject" data-i="${c.id}">Recusar</button></div>`:""}</div>`;
  }).join("");
  const whats=dir()?`<section class="card"><h2>💬 Aviso pelo WhatsApp</h2><p class="sm">Informe o telefone do responsável com código do país (ex.: 5521999999999). O botão abre uma mensagem pronta no WhatsApp; basta enviá-la.</p><label for="c-tel">Telefone do responsável</label><input id="c-tel" inputmode="tel" placeholder="5521999999999"><label for="c-msg">Mensagem</label><textarea id="c-msg">Olá! A diretoria da Recreação Baby atualizou o status do comprovante de mensalidade. Entre na sua área do responsável para consultar.</textarea><button class="ghost" data-a="cwa">Abrir WhatsApp</button></section>`:"";
  return `${form}<section class="card"><div class="hd"><h2>🧾 ${dir()?"Comprovantes recebidos":"Meus comprovantes"}</h2>${dir()?`<span class="tg t-op">${C.filter(c=>c.status==="pending").length} pendente(s)</span>`:""}</div>
  ${rows||empty("Nenhum comprovante registrado.")}</section>${whats}`;
}
function alunos(){
  return`<section class="card"><div class="hd"><h2>👥 Alunos & Turmas</h2><button class="pri" data-a="anew">+ Novo aluno</button></div><div class="sc"><table><tr><th>Aluno</th><th>Turma</th><th>Responsável</th><th>Matrícula</th><th></th></tr>${db.alunos.map(a=>`<tr><td><b>${esc(a.nome)}</b></td><td>${esc(a.turma)}</td><td>${esc(a.resp)}</td><td>${esc(a.mat)}</td><td><button class="ghost" data-a="aed" data-i="${a.id}">Editar</button> <button class="x" data-a="adel" data-i="${a.id}" aria-label="Excluir ${esc(a.nome)}">🗑</button></td></tr>`).join("")}</table></div></section>`;
}
function painel(){
  return`<div class="two">${TURMAS.map(t=>{const A=db.alunos.filter(a=>a.turma===t),atr=db.fin.filter(f=>A.some(a=>a.id===f.aluno)&&!f.pago&&f.venc<hojeISO()).length,np=db.posts.filter(p=>p.turma===t).length;
  return`<section class="card"><div class="hd"><h2>${t}</h2><span class="tg t-ok">${A.length} aluno(s)</span></div><p class="sm">${np} publicação(ões) na agenda • ${atr} mensalidade(s) atrasada(s)</p><div class="chips">${A.map(a=>`<span>${esc(a.nome)}</span>`).join("")||empty("Turma sem alunos.")}</div></section>`}).join("")}</div>`;
}

/* ações */
/* matrícula: ANO-NÚMERO (ex.: 2026-0001). O contador nunca volta atrás, então o número de um aluno excluído não é reaproveitado. */
function proximaMat(){
  const ano=String(new Date().getFullYear());
  db.seq=db.seq||{};
  const maior=Math.max(0,...db.alunos.filter(x=>x.mat.startsWith(ano+"-")).map(x=>parseInt(x.mat.slice(5),10)||0));
  const n=Math.max(db.seq[ano]||0,maior)+1;
  db.seq[ano]=n;
  return ano+"-"+String(n).padStart(4,"0");
}
function proxMes(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function formAluno(a){
  return`<h2>${a?"Editar aluno":"Novo aluno"}</h2><label>Nome da criança</label><input name="nome" value="${esc(a?.nome)}"><label>Turma</label><select name="turma">${TURMAS.map(t=>`<option ${t===a?.turma?"selected":""}>${t}</option>`).join("")}</select><label>Responsável</label><input name="resp" value="${esc(a?.resp)}">`;
}
$("#pg").onclick=e=>{
  const g=e.target.closest("[data-g]");if(g){pg=g.dataset.g;draw();return}
  const t=e.target.closest("[data-a]");if(!t)return;const i=t.dataset.i,a=t.dataset.a;
  if(a==="padd"){const ti=$("#pt").value.trim();if(!ti)return;db.posts.push({id:uid(),data:hojeISO(),titulo:ti,turma:$("#pu").value,ic:$("#pi").value,txt:$("#px").value.trim()})}
  else if(a==="pdel")db.posts=db.posts.filter(p=>p.id!==i);
  else if(a==="eadd"){const ti=$("#et").value.trim();if(!ti||!$("#ed").value)return;db.eventos.push({id:uid(),data:$("#ed").value,titulo:ti,turma:$("#eu").value,txt:$("#ex").value.trim()})}
  else if(a==="edel")db.eventos=db.eventos.filter(p=>p.id!==i);
  else if(a==="bsave"){const areas={};document.querySelectorAll("[data-ar]").forEach(s=>areas[s.dataset.ar]=s.value);db.bol[selAl]={areas,obs:$("#ob").value};save();$("#ok").textContent="Boletim salvo.";return}
  else if(a==="csubmit"){
    const alunoId=$("#c-aluno")?.value, mes=$("#c-mes")?.value, valorTxt=$("#c-valor")?.value.trim(), data=$("#c-data")?.value, file=$("#c-arquivo")?.files?.[0];
    if(!alunoId||!mes||!valorTxt||!data||!file){alert("Preencha os campos e selecione o comprovante.");return}
    if(!["application/pdf","image/jpeg","image/png"].includes(file.type)){alert("Envie um PDF, JPG ou PNG.");return}
    if(file.size>5*1024*1024){alert("O arquivo deve ter no máximo 5 MB.");return}
    const valor=Number(valorTxt.replace(/\./g,"").replace(",","."));
    if(!Number.isFinite(valor)||valor<=0){alert("Informe um valor válido.");return}
    db.comprovantes=db.comprovantes||[];
    db.comprovantes.push({id:uid(),aluno:alunoId,mes,valor,enviado:data,arquivo:file.name,status:"pending",motivo:"",revisadoEm:"",revisadoPor:""});
    save();draw();alert("Comprovante registrado. Aguarde a análise da diretoria.");
    return;
  }
  else if(a==="cconfirm"){
    if(!dir()){alert("Somente a diretoria pode confirmar.");return}
    const c=(db.comprovantes||[]).find(x=>x.id===i);if(!c)return;
    if(!confirm("Confirmar manualmente o recebimento deste pagamento? Use somente após conferir o pagamento fora do sistema."))return;
    c.status="confirmed";c.revisadoEm=hojeISO();c.revisadoPor=U.nome;
  }
  else if(a==="creject"){
    if(!dir()){alert("Somente a diretoria pode recusar.");return}
    const c=(db.comprovantes||[]).find(x=>x.id===i);if(!c)return;
    const motivo=prompt("Informe o motivo da recusa:");if(!motivo||!motivo.trim())return;
    c.status="rejected";c.motivo=motivo.trim();c.revisadoEm=hojeISO();c.revisadoPor=U.nome;
  }
  else if(a==="cwa"){
    const tel=($("#c-tel")?.value||"").replace(/\D/g,""),msg=$("#c-msg")?.value||"";
    if(tel.length<10){alert("Informe o telefone com código do país, por exemplo 5521999999999.");return}
    window.open("https://wa.me/"+tel+"?text="+encodeURIComponent(msg),"_blank","noopener");
    return;
  }
  else if(a==="pay"){const f=db.fin.find(f=>f.id===i);f.pago=!f.pago}
  else if(a==="anew")return dlg(formAluno(),v=>{
    if(!v.nome||!v.resp)return"Informe o nome da criança e do responsável.";
    const id=uid(),m=proximaMat(),ms=proxMes();
    db.alunos.push({id,nome:v.nome,turma:v.turma,resp:v.resp,mat:m,nasc:""});
    db.fin.push({id:uid(),aluno:id,mes:ms,valor:VAL[v.turma],venc:ms+"-10",pago:false});
    save();draw();
    alert(`Aluno cadastrado!\n\nMatrícula: ${m}\n\nEla é o login e a senha do responsável para entrar no sistema.`);
  });
  else if(a==="aed"){const x=aluno(i);return dlg(formAluno(x),v=>{if(!v.nome||!v.resp)return"Informe o nome da criança e do responsável.";Object.assign(x,v);save();draw()})}
  else if(a==="adel"){const x=aluno(i);if(!confirm(`Excluir ${x.nome}? A matrícula (login e senha do responsável), as mensalidades, o boletim e os comprovantes também serão removidos.`))return;db.alunos=db.alunos.filter(y=>y!==x);db.fin=db.fin.filter(f=>f.aluno!==i);db.comprovantes=(db.comprovantes||[]).filter(c=>c.aluno!==i);delete db.bol[i]}
  save();draw();
};
$("#pg").onchange=e=>{if(e.target.id==="bs"){selAl=e.target.value;draw()}};
</script>
